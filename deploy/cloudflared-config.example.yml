# /etc/cloudflared/config.yml   — generated by deploy/setup-tunnel.sh
#
# The account on this host is already logged in (~/.cloudflared/cert.pem).
# mcpprox.scooom.com is a pre-provisioned proxied record with Cloudflare Access
# in front (returns 401 unauthenticated).
#
# Run deploy/setup-tunnel.sh to create the tunnel, repoint the DNS record, write
# this file, and install the cloudflared service.

tunnel: <tunnel-id>
credentials-file: /root/.cloudflared/<tunnel-id>.json

ingress:
  - hostname: mcpprox.scooom.com
    service: http://127.0.0.1:8788
  - service: http_status:404
