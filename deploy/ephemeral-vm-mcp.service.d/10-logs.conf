# journald has no working storage inside the unprivileged mcpProx LXC
# (`journalctl -u ephemeral-vm-mcp` shows nothing), so send the process
# output to a plain file instead. Pair with deploy/logrotate.ephemeral-vm-mcp.
#
#   install -D -m644 deploy/ephemeral-vm-mcp.service.d/10-logs.conf \
#     /etc/systemd/system/ephemeral-vm-mcp.service.d/10-logs.conf
#   install -m644 deploy/logrotate.ephemeral-vm-mcp /etc/logrotate.d/ephemeral-vm-mcp
#   systemctl daemon-reload && systemctl restart ephemeral-vm-mcp
[Service]
StandardOutput=append:/var/log/ephemeral-vm-mcp.log
StandardError=append:/var/log/ephemeral-vm-mcp.log
